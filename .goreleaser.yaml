version: 2

project_name: ytunes

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: ytunes

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  # CHANGELOG.md is hand-maintained (see RELEASE.md) and already has the
  # per-version notes; reuse them as the GitHub release body instead of
  # letting GoReleaser generate one from commit messages.
  header: |
    See [CHANGELOG.md](https://github.com/sina96/ytunes/blob/main/CHANGELOG.md) for full notes.
