version: 2

project_name: ytunes

before:
  hooks:
    - go mod tidy -diff

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: ytunes

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  # Link to CHANGELOG.md as it existed at this tag, not at main's tip,
  # so old releases keep pointing at the notes that were true then.
  header: |
    See [CHANGELOG.md](https://github.com/sina96/ytunes/blob/{{ .Tag }}/CHANGELOG.md) for full notes.
